[package]
name = "jack-sparrow"
version = "0.3.0"
edition = "2021"
authors = ["Jack Sparrow Crew"]
description = "Professional web pentesting tool — find SQLi, XSS, IDOR, SSRF, and Supply Chain vulnerabilities"
license = "MIT"
repository = "https://github.com/your-repo/jack-sparrow"

[[bin]]
name = "sparrow"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "cookies"] }

# Playwright for session recording
playwright-rs = "0.15"

# XSS scanning (dalfox wrapper)
dalfox-rs = "0.5.5"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "1"
anyhow = "1"

# Terminal output
colored = "2"
indicatif = "0.17"

# UUID for findings
uuid = { version = "1", features = ["v4", "serde"] }

# Chrono for timestamps
chrono = { version = "0.4", features = ["serde"] }

# Regex for pattern matching
regex = "1"

# TOML config
toml = "0.8"

# Temp files for tool orchestration
tempfile = "3"

# Async trait
async-trait = "0.1"

# URL parsing
url = "2"

# Ctrl+C handler
ctrlc = "3"

# Crawler
scraper = "0.19"              # HTML parsing with CSS selectors
governor = "0.6"              # Rate limiting (GCRA algorithm)
dashmap = "5"                 # Concurrent hashmap for visited URLs
bloomfilter = "1"             # Probabilistic dedup for large crawls
robots_txt = "0.7"            # robots.txt parsing
async-channel = "1"           # Async mpsc channels for frontier queue

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

# Async utilities (join_all, streams)
futures = "0.3"

# JWT analysis
base64 = "0.22"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
reqwest = { version = "0.12", features = ["cookies"] }
url = "2"

[[bench]]
name = "scanner_bench"
harness = false

[[test]]
name = "integration"
path = "tests/integration/scanners_test.rs"

[[test]]
name = "e2e"
path = "tests/e2e/cli_test.rs"

[[test]]
name = "labs_e2e"
path = "tests/labs_e2e.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
